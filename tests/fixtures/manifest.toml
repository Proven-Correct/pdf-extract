# compat_points, gate (exact | similarity | divergence | skip | hostile | ocr).
# gate = "ocr" (corpus D, run 0002 §3.8) also requires `subset` and `truth`
# (the ground-truth .txt fixture). `[[built]]` rows are the opposite of
# `[[fixture]]`: corpus D's noise variants, built at test time into
