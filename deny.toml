# cargo-deny policy. Role: keeps every dependency (including transitive and
# vendored-crate dependencies) permissively licensed, free of known advisories,
# and sourced only from crates.io. Run in CI by the `deny` job.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# cargo-deny >= 0.18 removed the `copyleft` and `unlicensed` keys: with an
# allow-list, copyleft and unlicensed crates are denied by construction.
# Allow-list only: anything not named here (all copyleft included) is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    # Fonts embedded by hayro-interpret, if present in the dependency graph.
    "OFL-1.1",
]
# The allow-list is intentionally wider than what the graph uses today
# (later units add dependencies), so unmatched entries are not warnings.
unused-allowed-license = "allow"

[licenses.private]
ignore = true
# Our own crates are GPL-3.0-or-later and `publish = false`; `private` exempts
# exactly such unpublished workspace members from the allow-list, so the
# allow-list above keeps rejecting GPL/LGPL/AGPL *dependencies* (spec L1, D-40).
# It must not be widened to cover our own license.

[bans]
# Duplicate versions are a size/maintenance smell, not a correctness problem.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
