# Frees disk on a GitHub-hosted ubuntu-24.04 runner by deleting preinstalled
# SDKs this project never uses (.NET, Android, GHC, CodeQL; well over 20 GB).
# The runner's 72 GB root filesystem starts with only ~3 GB free once the
# Rust cache is restored, and the jobs that build the workspace's tests more
# than once or with coverage instrumentation can fill it: the `rust` job's
# second, `render-support` test build ran out (2.9 GB free before it, 54 MB
# after) and the linker died with SIGBUS writing a test binary, which does
# not look like a disk problem at all. A no-op on other runner OSes.
name: free-disk
description: Delete unused preinstalled SDKs on Linux runners and log the free space
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        # Logged so the remaining headroom is visible when a job grows.
        df -h /
