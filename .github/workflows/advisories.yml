# Weekly RustSec advisory check (licensing spec "Advisory and duplicate-version
# checks"; design D6 of the complete-license-pipeline change; ADR 0095).
#
# CI checks advisories on every main push and the release workflow on every
# release, but an advisory published after a release would otherwise go
# unseen until the next push. This is the repository's only `schedule`
# trigger: the project owner approved it on 2026-10-22 because it costs a few
# runner-minutes a week. It runs nothing but `cargo deny check advisories`:
# no build (the action's `cargo metadata` may install the rust-toolchain.toml
# pin, which is most of the run time). The cap on scheduled heavy
# workflows (fuzzing, sanitizers, wheels) still applies to everything else.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab. A failed run notifies the
# repository's watchers by GitHub's default.
name: Advisories

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
